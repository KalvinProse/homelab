# Jellyfin Docker Compose File
#
services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: 1000:1000
    # group below should be render group on your system.
    group_add:
      - '989'
    network_mode: 'host'
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    # Writes persistent data to jellyfin directory.
    volumes:
      - ./config:/config
      - ./cache:/cache
      # File path below specific to where your store media library
      - type: bind
        source: /mnt/mediaserver
        target: /media
        read_only: true
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      #- type: bind
      #  source: /path/to/fonts
      #  target: /usr/local/share/fonts/custom
      #  read_only: true
    # Used for gpu acceleration
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    # environment:
    #  - JELLYFIN_PublishedServerUrl=http://example.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    # extra_hosts:
    #  - 'host.docker.internal:host-gateway'
